<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">The Cold Stack: six layers in physical order</title><desc id="desc">Six layers, from top to bottom: cold plate, upper thermal interface, thermoelectric module, lower thermal interface, hot-side spreader, and heatsink. The shallow viewing angle keeps each layer distinct. This is a conceptual drawing, not to scale. Hot-side heat includes the cold-side load and electrical input.</desc><rect width="760" height="640" rx="8" fill="#edf3f6"/><g font-family="Segoe UI,Arial,sans-serif" fill="#143348"><text x="35" y="34" font-size="24" font-weight="600">The cold-to-hot path</text><g font-size="30">
