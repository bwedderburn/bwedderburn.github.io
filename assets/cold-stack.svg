<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">The Cold Stack: conceptual thermoelectric assembly</title>
  <desc id="desc">An exploded stack shows the cold plate, two thin thermal interfaces, a thermoelectric module, a hot-side spreader, and a heat sink. Heat removed from the cold side and electrical input both leave through the hot side.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#147f84" stroke-width="1.5"/></marker></defs>
  <rect width="760" height="550" rx="8" fill="#edf3f6"/>
  <g fill="none" stroke="#cbd9e1" stroke-width="1"><path d="M35 70H725M35 470H725M90 35V510"/><path d="M165 55V470M433 55V470" stroke-dasharray="4 7"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#143348">
    <text x="35" y="38" font-size="15" font-weight="600">The interfaces carry the story.</text>
    <g stroke="#143348" stroke-width="2">
      <path d="m150 112 235-35 97 40-235 35Z" fill="#cbd9e1"/><path d="m150 112 97 40 235-35v22l-235 35-97-40Z" fill="#dae6ec"/>
      <path d="m150 205 235-35 97 40-235 35Z" fill="#f3b77c"/><path d="m150 205 97 40 235-35v5l-235 35-97-40Z" fill="#a95420"/>
      <path d="m170 277 203-30 85 35-203 30Z" fill="#fcfdfe"/><path d="m170 277 85 35 203-30v25l-203 30-85-35Z" fill="#143348"/>
      <path d="m150 350 235-35 97 40-235 35Z" fill="#f3b77c"/>
      <path d="m135 409 260-39 108 45-260 39Z" fill="#b8cdd8"/><path d="m135 409 108 45 260-39v23l-260 39-108-45Z" fill="#143348"/>
    </g>
    <g fill="none" stroke="#506676" stroke-width="1.2"><path d="m480 125 45-7h31M479 212l46-7h31M461 293l64-8h31M482 356l43-6h31M503 427l22-7h31"/></g>
    <g font-size="16"><text x="567" y="123">Cold plate</text><text x="567" y="210">Thin interface</text><text x="567" y="290">Peltier module</text><text x="567" y="355">Thin interface</text><text x="567" y="425">Hot-side path</text></g>
    <path d="M78 127V212" fill="none" stroke="#147f84" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="35" y="244" font-size="15">Cold-side</text><text x="35" y="264" font-size="15">load Qc</text>
    <path d="M65 330h72" fill="none" stroke="#147f84" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="35" y="365" font-size="15">Input Pin</text>
    <text x="35" y="507" font-size="18" font-weight="600">Hot-side heat: Qh = Qc + Pin</text>
    <text x="430" y="507" font-size="13" fill="#506676">Conceptual • not to scale • no test data</text>
  </g>
</svg>
