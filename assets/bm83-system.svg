  <rect x="433" y="54" width="197" height="100" rx="9" fill="#fff" stroke="#b6ccd7"/><rect x="448" y="68" width="66" height="72" rx="4" fill="#285166"/><path d="M459 84h43M459 97h32" stroke="#badce2" stroke-width="3"/><circle cx="464" cy="124" r="5" fill="#f3b77c"/><text x="526" y="92" font-size="18" fill="#143348">Nextion</text><text x="526" y="118" font-size="13" fill="#506676">Touchscreen</text>
