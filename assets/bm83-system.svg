<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="title desc"><title id="title">BM83 control interfaces</title><desc id="desc">An ESP32-S3 controller connects through UART to a BM83 audio module and Nextion touchscreen, and through ESP-NOW to a CrowPanel remote.</desc>
