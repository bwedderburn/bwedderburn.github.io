  <rect x="30" y="299" width="192" height="91" rx="9" fill="#fff" stroke="#b6ccd7"/><rect x="43" y="312" width="60" height="63" rx="4" fill="#285166"/><rect x="52" y="321" width="22" height="22" fill="#c88b50"/><path d="M52 354h40M52 363h30" stroke="#badce2" stroke-width="3"/><text x="116" y="334" font-size="17" fill="#143348">CrowPanel</text><text x="116" y="359" font-size="13" fill="#506676">Wireless remote</text>
