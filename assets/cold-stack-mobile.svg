<g data-stack-layer="module" data-stack-level="2" transform="translate(0 237)"><path d="m18 0 116-8 44 12-116 8Z" fill="#fcfdfe" stroke="#143348" stroke-width="2"/><path d="m18 0 44 12 116-8v16l-116 8-44-12Z" fill="#143348" stroke="#143348" stroke-width="2"/></g>
<g data-stack-layer="upper-interface" data-stack-level="1" transform="translate(0 161)"><path d="m18 0 116-8 44 12-116 8Z" fill="#f3b77c" stroke="#143348" stroke-width="2"/><path d="m18 0 44 12 116-8v3l-116 8-44-12Z" fill="#a95420" stroke="#143348" stroke-width="2"/></g>
