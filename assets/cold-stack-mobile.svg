<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc"><title id="title">The Cold Stack: a labeled conceptual assembly</title><desc id="desc">Six layers, from top to bottom: cold plate, upper thermal interface, thermoelectric module, lower thermal interface, hot-side spreader, and heat sink. Hot-side heat includes the cold-side load and electrical input.</desc><rect width="360" height="640" rx="8" fill="#edf3f6"/><text x="18" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#143348">The cold-to-hot path</text><g font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#143348"><g data-stack-layer="" transform="translate(0 85)"><path d="m18 0 116-16 44 20-116 16Z" fill="#cbd9e1" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v18l-116 16-44-20Z" fill="#dae6ec" stroke="#143348" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Cold plate</text></g><g data-stack-layer="" transform="translate(0 155.4)"><path d="m18 0 116-16 44 20-116 16Z" fill="#f3b77c" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v4l-116 16-44-20Z" fill="#a95420" stroke="#143348" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Interface</text></g><g data-stack-layer="" transform="translate(0 225.8)"><path d="m18 0 116-16 44 20-116 16Z" fill="#fcfdfe" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v18l-116 16-44-20Z" fill="#143348" stroke="#143348" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Module</text></g><g data-stack-layer="" transform="translate(0 296.2)"><path d="m18 0 116-16 44 20-116 16Z" fill="#f3b77c" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v4l-116 16-44-20Z" fill="#a95420" stroke="#143348" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Interface</text></g><g data-stack-layer="" transform="translate(0 366.6)"><path d="m18 0 116-16 44 20-116 16Z" fill="#b8cdd8" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v18l-116 16-44-20Z" fill="#dae6ec" stroke="#143348" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Spreader</text></g><g data-stack-layer="" transform="translate(0 437)"><path d="m18 0 116-16 44 20-116 16Z" fill="#dae6ec" stroke="#143348" stroke-width="2"/><path d="m18 0 44 20 116-16v18l-116 16-44-20Z" fill="#143348" stroke="#143348" stroke-width="2"/><path d="M42 29v17M65 27v19M88 24v19M111 22v19M134 20v19M157 17v19" stroke="#b8cdd8" stroke-width="2"/><path d="M181 8h15" stroke="#506676" stroke-width="1.5"/><text x="205" y="15">Heat sink</text></g></g><g font-family="Segoe UI,Arial,sans-serif" fill="#143348"><text x="18" y="550" font-size="22">Hot-side heat</text><text x="18" y="585" font-size="26" font-weight="600">Qh = Qc + Pin</text><text x="18" y="618" font-size="18" fill="#506676">Conceptual, not to scale</text></g></svg>
