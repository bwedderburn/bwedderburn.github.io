<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc"><title id="title">The Cold Stack: six layers in physical order</title><desc id="desc">Six layers, from top to bottom: cold plate, upper thermal interface, thermoelectric module, lower thermal interface, hot-side spreader, and heatsink. The shallow viewing angle keeps each layer distinct. This is a conceptual drawing, not to scale. Hot-side heat includes the cold-side load and electrical input.</desc><rect width="360" height="640" rx="8" fill="#edf3f6"/><g font-family="Segoe UI,Arial,sans-serif" fill="#143348"><text x="18" y="34" font-size="20" font-weight="600">The cold-to-hot path</text><g font-size="25">
<g data-stack-layer="heatsink" data-stack-level="5" transform="translate(0 465)"><path d="m18 0 116-8 44 12-116 8Z" fill="#dae6ec" stroke="#143348" stroke-width="2"/><path d="m18 0 44 12 116-8v24l-116 8-44-12Z" fill="#143348" stroke="#143348" stroke-width="2"/><path d="M38 8v18M61 14v18M84 12v18M107 10v18M130 8v18M153 6v18" fill="none" stroke="#b8cdd8" stroke-width="2"/></g>
<g data-stack-layer="spreader" data-stack-level="4" transform="translate(0 389)"><path d="m18 0 116-8 44 12-116 8Z" fill="#b8cdd8" stroke="#143348" stroke-width="2"/><path d="m18 0 44 12 116-8v12l-116 8-44-12Z" fill="#cbd9e1" stroke="#143348" stroke-width="2"/></g>
